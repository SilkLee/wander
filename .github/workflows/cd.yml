name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  # ─────────────────────────────────────────────
  # Only proceed on successful CI
  # ─────────────────────────────────────────────
  check-ci:
    name: Check CI Success
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha: ${{ steps.get-sha.outputs.sha }}
    steps:
      - name: Get triggering commit SHA
        id: get-sha
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  # Detect which services changed
  # ─────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: check-ci
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      agent-orchestrator: ${{ steps.filter.outputs.agent-orchestrator }}
      indexing: ${{ steps.filter.outputs.indexing }}
      model-service: ${{ steps.filter.outputs.model-service }}
      metrics: ${{ steps.filter.outputs.metrics }}
      finetune: ${{ steps.filter.outputs.finetune }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            ingestion:
              - 'services/ingestion/**'
            agent-orchestrator:
              - 'services/agent-orchestrator/**'
            indexing:
              - 'services/indexing/**'
            model-service:
              - 'services/model-service/**'
            metrics:
              - 'services/metrics/**'
            finetune:
              - 'services/finetune/**'
            frontend:
              - 'frontend/**'

  # ─────────────────────────────────────────────
  # Build and push changed services to ECR
  # ─────────────────────────────────────────────
  build-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [check-ci, detect-changes]
    if: |
      needs.detect-changes.outputs.api-gateway == 'true' ||
      needs.detect-changes.outputs.ingestion == 'true' ||
      needs.detect-changes.outputs.agent-orchestrator == 'true' ||
      needs.detect-changes.outputs.indexing == 'true' ||
      needs.detect-changes.outputs.model-service == 'true' ||
      needs.detect-changes.outputs.metrics == 'true' ||
      needs.detect-changes.outputs.finetune == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: services/api-gateway
            changed: ${{ needs.detect-changes.outputs.api-gateway }}
          - service: ingestion
            context: services/ingestion
            changed: ${{ needs.detect-changes.outputs.ingestion }}
          - service: agent-orchestrator
            context: services/agent-orchestrator
            changed: ${{ needs.detect-changes.outputs.agent-orchestrator }}
          - service: indexing
            context: services/indexing
            changed: ${{ needs.detect-changes.outputs.indexing }}
          - service: model-service
            context: services/model-service
            changed: ${{ needs.detect-changes.outputs.model-service }}
          - service: metrics
            context: services/metrics
            changed: ${{ needs.detect-changes.outputs.metrics }}
          - service: finetune
            context: services/finetune
            changed: ${{ needs.detect-changes.outputs.finetune }}
          - service: frontend
            context: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}

    steps:
      - name: Skip if unchanged
        if: ${{ matrix.changed != 'true' }}
        run: echo "Service ${{ matrix.service }} unchanged — skipping"

      - uses: actions/checkout@v4
        if: ${{ matrix.changed == 'true' }}
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ matrix.changed == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-workflowai
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ matrix.changed == 'true' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: ${{ matrix.changed == 'true' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ needs.check-ci.outputs.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/workflowai/${{ matrix.service }}:$IMAGE_TAG \
            ${{ matrix.context }}
          docker push $ECR_REGISTRY/workflowai/${{ matrix.service }}:$IMAGE_TAG
          echo "Pushed $ECR_REGISTRY/workflowai/${{ matrix.service }}:$IMAGE_TAG"

  # ─────────────────────────────────────────────
  # Update image tags in kustomize overlay
  # ArgoCD auto-syncs on git change
  # ─────────────────────────────────────────────
  update-manifests:
    name: Update Kustomize Image Tags
    runs-on: ubuntu-latest
    needs: [check-ci, detect-changes, build-push]
    if: |
      always() &&
      needs.build-push.result != 'failure' &&
      (
        needs.detect-changes.outputs.api-gateway == 'true' ||
        needs.detect-changes.outputs.ingestion == 'true' ||
        needs.detect-changes.outputs.agent-orchestrator == 'true' ||
        needs.detect-changes.outputs.indexing == 'true' ||
        needs.detect-changes.outputs.model-service == 'true' ||
        needs.detect-changes.outputs.metrics == 'true' ||
        needs.detect-changes.outputs.finetune == 'true' ||
        needs.detect-changes.outputs.frontend == 'true'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-workflowai
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR registry URL
        id: ecr
        run: |
          echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Update image tags
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ needs.check-ci.outputs.sha }}
        run: |
          cd k8s/overlays/production
          SERVICES=(api-gateway ingestion agent-orchestrator indexing model-service metrics finetune frontend)
          for SERVICE in "${SERVICES[@]}"; do
            kustomize edit set image \
              "<ECR_URL>/workflowai/${SERVICE}=${ECR_REGISTRY}/workflowai/${SERVICE}:${IMAGE_TAG}"
          done

      - name: Commit and push updated tags
        env:
          IMAGE_TAG: sha-${{ needs.check-ci.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(deploy): update image tags to ${IMAGE_TAG} [skip ci]"
          git push origin main
