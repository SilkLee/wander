apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workflowai
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: workflowai
spec:
  project: workflowai
  source:
    repoURL: https://github.com/SilkLee/workflow-ai.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: workflowai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
