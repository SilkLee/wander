# Replace with real values before deploying.
# Use: echo -n 'value' | base64
# Example: echo -n 'my-jwt-secret' | base64
apiVersion: v1
kind: Secret
metadata:
  name: workflowai-secrets
  namespace: workflowai
type: Opaque
data:
  # base64("changeme") = Y2hhbmdlbWU=
  POSTGRES_PASSWORD: Y2hhbmdlbWU=
  # base64("changeme-jwt-secret") = Y2hhbmdlbWUtand0LXNlY3JldA==
  JWT_SECRET: Y2hhbmdlbWUtand0LXNlY3JldA==
  # base64("") = empty — replace with real OpenAI API key
  OPENAI_API_KEY: ""
  # base64("") = empty — replace with real OpenRouter API key
  OPENROUTER_API_KEY: ""
