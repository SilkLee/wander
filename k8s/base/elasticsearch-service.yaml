apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: workflowai
  labels:
    app: elasticsearch
    component: search
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
      name: http
    - port: 9300
      targetPort: 9300
      name: transport
