apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  namespace: workflowai
  labels:
    app: metrics
    component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics
  template:
    metadata:
      labels:
        app: metrics
        component: service
    spec:
      containers:
        - name: metrics
          image: 589528730663.dkr.ecr.ap-southeast-1.amazonaws.com/workflowai/metrics:sha-47a7fbd
          ports:
            - containerPort: 8005
              name: http
          env:
            - name: PORT
              value: "8005"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workflowai-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://workflowai:$(POSTGRES_PASSWORD)@postgres:5432/workflowai"
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
