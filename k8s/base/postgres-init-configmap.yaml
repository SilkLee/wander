apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: workflowai
data:
  init.sql: |
    -- WorkflowAI Database Initialization Script
    -- Purpose: Create initial database schema for all services
    -- Target: PostgreSQL 15+

    -- Enable required extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";  -- For text search optimization

    -- ============================================================================
    -- AGENT ORCHESTRATOR TABLES
    -- ============================================================================

    -- Workflows table (LangChain agent workflows)
    CREATE TABLE IF NOT EXISTS workflows (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        name VARCHAR(255) NOT NULL,
        description TEXT,
        config JSONB NOT NULL DEFAULT '{}',
        status VARCHAR(50) NOT NULL DEFAULT 'active',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Workflow executions (history of workflow runs)
    CREATE TABLE IF NOT EXISTS workflow_executions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        workflow_id UUID NOT NULL REFERENCES workflows(id) ON DELETE CASCADE,
        input JSONB NOT NULL,
        output JSONB,
        status VARCHAR(50) NOT NULL DEFAULT 'pending',
        error TEXT,
        started_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        completed_at TIMESTAMP WITH TIME ZONE,
        duration_ms INTEGER
    );

    -- Agent interactions (individual LLM calls within workflows)
    CREATE TABLE IF NOT EXISTS agent_interactions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        execution_id UUID NOT NULL REFERENCES workflow_executions(id) ON DELETE CASCADE,
        agent_type VARCHAR(100) NOT NULL,
        prompt TEXT NOT NULL,
        response TEXT,
        tokens_used INTEGER,
        latency_ms INTEGER,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- ============================================================================
    -- METRICS SERVICE TABLES
    -- ============================================================================

    -- API metrics (request/response tracking)
    CREATE TABLE IF NOT EXISTS api_metrics (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        service_name VARCHAR(100) NOT NULL,
        endpoint VARCHAR(255) NOT NULL,
        method VARCHAR(10) NOT NULL,
        status_code INTEGER NOT NULL,
        response_time_ms INTEGER NOT NULL,
        request_size_bytes INTEGER,
        response_size_bytes INTEGER,
        user_id UUID,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Model metrics (LLM usage tracking)
    CREATE TABLE IF NOT EXISTS model_metrics (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        model_name VARCHAR(100) NOT NULL,
        operation VARCHAR(50) NOT NULL,
        tokens_input INTEGER NOT NULL,
        tokens_output INTEGER NOT NULL,
        latency_ms INTEGER NOT NULL,
        cost_usd DECIMAL(10, 6),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- System health metrics (resource usage)
    CREATE TABLE IF NOT EXISTS system_metrics (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        service_name VARCHAR(100) NOT NULL,
        cpu_percent DECIMAL(5, 2),
        memory_mb INTEGER,
        disk_mb INTEGER,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- DORA Event tables (deployment tracking for DORA metrics)
    CREATE TABLE IF NOT EXISTS deployment_events (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        repository VARCHAR(255) NOT NULL,
        commit_sha VARCHAR(64) NOT NULL,
        deployed_at TIMESTAMP WITH TIME ZONE NOT NULL,
        success BOOLEAN NOT NULL DEFAULT true,
        metadata JSONB DEFAULT '{}',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS change_events (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        repository VARCHAR(255) NOT NULL,
        commit_sha VARCHAR(64) NOT NULL,
        first_commit_at TIMESTAMP WITH TIME ZONE NOT NULL,
        merged_at TIMESTAMP WITH TIME ZONE,
        deployed_at TIMESTAMP WITH TIME ZONE,
        metadata JSONB DEFAULT '{}',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS incident_events (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        repository VARCHAR(255) NOT NULL,
        detected_at TIMESTAMP WITH TIME ZONE NOT NULL,
        resolved_at TIMESTAMP WITH TIME ZONE,
        caused_by_sha VARCHAR(64),
        severity VARCHAR(20) DEFAULT 'medium',
        metadata JSONB DEFAULT '{}',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- ============================================================================
    -- SHARED TABLES (used by multiple services)
    -- ============================================================================

    -- Documents table (ingested documents metadata)
    CREATE TABLE IF NOT EXISTS documents (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        filename VARCHAR(255) NOT NULL,
        file_type VARCHAR(50) NOT NULL,
        file_size_bytes INTEGER NOT NULL,
        content_hash VARCHAR(64) NOT NULL UNIQUE,
        storage_path TEXT NOT NULL,
        status VARCHAR(50) NOT NULL DEFAULT 'pending',
        metadata JSONB DEFAULT '{}',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        indexed_at TIMESTAMP WITH TIME ZONE
    );

    -- Document chunks (for RAG retrieval)
    CREATE TABLE IF NOT EXISTS document_chunks (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        document_id UUID NOT NULL REFERENCES documents(id) ON DELETE CASCADE,
        chunk_index INTEGER NOT NULL,
        content TEXT NOT NULL,
        token_count INTEGER NOT NULL,
        embedding_id VARCHAR(255),
        metadata JSONB DEFAULT '{}',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(document_id, chunk_index)
    );

    -- Users table (for JWT authentication)
    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        email VARCHAR(255) NOT NULL UNIQUE,
        password_hash VARCHAR(255) NOT NULL,
        full_name VARCHAR(255),
        role VARCHAR(50) NOT NULL DEFAULT 'user',
        is_active BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        last_login_at TIMESTAMP WITH TIME ZONE
    );

    -- ============================================================================
    -- INDEXES (Performance optimization)
    -- ============================================================================

    CREATE INDEX IF NOT EXISTS idx_workflow_executions_workflow_id ON workflow_executions(workflow_id);
    CREATE INDEX IF NOT EXISTS idx_workflow_executions_status ON workflow_executions(status);
    CREATE INDEX IF NOT EXISTS idx_workflow_executions_started_at ON workflow_executions(started_at DESC);
    CREATE INDEX IF NOT EXISTS idx_agent_interactions_execution_id ON agent_interactions(execution_id);
    CREATE INDEX IF NOT EXISTS idx_agent_interactions_agent_type ON agent_interactions(agent_type);
    CREATE INDEX IF NOT EXISTS idx_api_metrics_service_name ON api_metrics(service_name);
    CREATE INDEX IF NOT EXISTS idx_api_metrics_endpoint ON api_metrics(endpoint);
    CREATE INDEX IF NOT EXISTS idx_api_metrics_created_at ON api_metrics(created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_model_metrics_model_name ON model_metrics(model_name);
    CREATE INDEX IF NOT EXISTS idx_model_metrics_created_at ON model_metrics(created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_documents_status ON documents(status);
    CREATE INDEX IF NOT EXISTS idx_documents_content_hash ON documents(content_hash);
    CREATE INDEX IF NOT EXISTS idx_documents_created_at ON documents(created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_document_chunks_document_id ON document_chunks(document_id);
    CREATE INDEX IF NOT EXISTS idx_document_chunks_embedding_id ON document_chunks(embedding_id);
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_deployment_events_repo ON deployment_events(repository);
    CREATE INDEX IF NOT EXISTS idx_deployment_events_deployed_at ON deployment_events(deployed_at DESC);
    CREATE INDEX IF NOT EXISTS idx_change_events_repo ON change_events(repository);
    CREATE INDEX IF NOT EXISTS idx_change_events_deployed_at ON change_events(deployed_at DESC);
    CREATE INDEX IF NOT EXISTS idx_incident_events_repo ON incident_events(repository);
    CREATE INDEX IF NOT EXISTS idx_incident_events_detected_at ON incident_events(detected_at DESC);

    -- ============================================================================
    -- TRIGGERS (Automatic timestamp updates)
    -- ============================================================================

    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE TRIGGER update_workflows_updated_at
        BEFORE UPDATE ON workflows
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    -- ============================================================================
    -- SEED DATA (Development only)
    -- ============================================================================

    INSERT INTO users (email, password_hash, full_name, role) VALUES
        ('admin@workflowai.dev', '$2a$10$YourBcryptHashHere', 'Admin User', 'admin'),
        ('test@workflowai.dev', '$2a$10$YourBcryptHashHere', 'Test User', 'user')
    ON CONFLICT DO NOTHING;

    INSERT INTO workflows (name, description, config) VALUES
        ('Document Q&A', 'RAG-based question answering over documents',
         '{"model": "Qwen2.5-7B", "temperature": 0.7, "max_tokens": 512}'::jsonb)
    ON CONFLICT DO NOTHING;

    -- ============================================================================
    -- GRANT PERMISSIONS
    -- ============================================================================

    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO workflowai;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO workflowai;
