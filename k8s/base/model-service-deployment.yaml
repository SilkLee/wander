apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: workflowai
  labels:
    app: model-service
    component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
        component: service
    spec:
      containers:
        - name: model-service
          image: 589528730663.dkr.ecr.ap-southeast-1.amazonaws.com/workflowai/model-service:sha-47a7fbd
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: MODEL_NAME
              value: "Qwen/Qwen2.5-1.5B-Instruct"
            - name: DEVICE
              value: "cpu"
            - name: MAX_MODEL_LEN
              value: "4096"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: model-cache
              mountPath: /app/cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
