apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: workflowai
  labels:
    app: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: 589528730663.dkr.ecr.ap-southeast-1.amazonaws.com/workflowai/ingestion:sha-47a7fbd
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: workflowai-config
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
